# ============================================================
# Configuracion central del proyecto
# Editar aca en lugar de tocar el codigo.
# ============================================================

project:
  seed: 42
  language: es

# --- Capa de agente (LLM local via Ollama) ---
agent:
  # Modelo Ollama. Recomendado para GTX 1650 4GB:
  #   - "llama3.2:3b-instruct-q4_K_M"  -> entra 100% en 4GB VRAM, rapido.
  #   - "qwen2.5:7b-instruct-q4_K_M"   -> mejor extraccion, se reparte GPU/CPU (mas lento).
  # Descargar con:  ollama pull llama3.2:3b-instruct-q4_K_M
  model: "llama3.2:3b-instruct-q4_K_M"
  base_url: "http://localhost:11434"
  temperature: 0.0
  num_ctx: 8192            # ventana de contexto
  max_react_steps: 12      # tope de pasos ReAct por pagina (evita loops)

# --- Scraper / objetivo ---
scrape:
  base_url: "https://www.zonaprop.com.ar"
  # Ruta de listado: departamentos en venta en Capital Federal (CABA).
  listing_path: "/departamentos-venta-capital-federal.html"
  max_listings: 12000      # objetivo orientativo 8.000-15.000
  max_pages: 400
  # De donde extraer cada aviso:
  #   "cards"  -> desde las tarjetas del listado (RECOMENDADO). Las tarjetas ya
  #               traen la descripcion completa; 25-30 avisos por request y no
  #               dispara el challenge de Cloudflare.
  #   "detail" -> visitando cada pagina de detalle. Da mas campos (antiguedad),
  #               pero ZonaProp la protege con Cloudflare y suele fallar.
  extract_from: "cards"
  # --- Grilla de busquedas (modo `--mode grid`) ---
  #
  # Cloudflare bloquea las URLs paginadas (-pagina-N.html) a partir de la 2,
  # pero la PRIMERA pagina de cada busqueda responde bien. En vez de insistir
  # contra el bloqueo, se recorren busquedas DISTINTAS: cada una es una consulta
  # normal, visitada una sola vez.
  #
  # Los slugs NO estan inventados: son los que el propio portal publica como
  # links de filtro en la pagina de listado (data-qa="option-link").
  # Combinar barrio x ambientes da celdas disjuntas, asi que casi no hay
  # solapamiento entre busquedas (igual se deduplica por URL).
  barrios:
    - palermo
    - belgrano
    - caballito
    - recoleta
    - villa-urquiza
    - nunez
    - almagro
    - villa-crespo
    - balvanera
    - flores
    - puerto-madero
    - barrio-norte
    - villa-devoto
    - colegiales
    - saavedra
    - san-cristobal
    - villa-del-parque
    - barracas
    - san-telmo
    - monserrat
  # Sufijos de ambientes. La cadena vacia significa "sin filtro de ambientes".
  ambientes:
    - ""
    - "-1-ambiente"
    - "-2-ambientes"
    - "-3-ambientes"
    - "-4-ambientes"
  headless: false          # false ayuda a pasar anti-bot en la primera corrida
  # Rate-limit cortes. Con "cards" cada request rinde 25-30 avisos, asi que se
  # puede esperar bastante entre paginas sin que la corrida se vuelva eterna.
  # Delays cortos disparan el challenge de Cloudflare a partir de la pagina 2.
  min_delay_s: 10.0
  max_delay_s: 20.0
  timeout_ms: 45000
  out_path: "data/raw/zonaprop_caba.jsonl"

# --- Fuente alternativa: Argenprop ---
# ZonaProp resulto inviable para juntar volumen: Cloudflare desafia el navegador
# automatizado desde la segunda request de cada sesion, y se descarto evadirlo.
# Argenprop, en cambio, HABILITA el acceso en su robots.txt (Allow hasta
# pagina-10 de cada busqueda), no necesita navegador y sus tarjetas traen
# descripcion completa + antiguedad.
argenprop:
  base_url: "https://www.argenprop.com"
  # Rutas publicadas por el propio sitio como links de filtro por barrio.
  barrios:
    - "/departamentos/venta/palermo"
    - "/departamentos/venta/belgrano"
    - "/departamentos/venta/caballito"
    - "/departamentos/venta/recoleta"
    - "/departamentos/venta/almagro"
    - "/departamentos/venta/villa-urquiza"
    - "/departamentos/venta/nunez"
    - "/departamentos/venta/flores"
    - "/departamentos/venta/villa-crespo"
    - "/departamentos/venta/colegiales"
    - "/departamentos/venta/balvanera"
    - "/departamentos/venta/barrio-norte"
    - "/departamentos/venta/saavedra"
    - "/departamentos/venta/san-cristobal"
    - "/departamentos/venta/san-telmo"
    - "/departamentos/venta/villa-devoto"
    - "/departamentos/venta/villa-del-parque"
    - "/departamentos/venta/villa-luro"
    - "/departamentos/venta/monserrat"
    - "/departamentos/venta/puerto-madero"
  # TOPE DURO de robots.txt: Allow hasta ?pagina-10, Disallow de ahi en mas.
  # El codigo lo valida (src/agent/argenprop.py -> MAX_PAGINA). No subirlo.
  max_pagina: 10
  # ATENCION: con delays de 2-5 s el sitio corta a las ~3 requests y devuelve
  # HTTP 202 con cuerpo VACIO (throttling por IP), y el corte persiste varios
  # minutos. 30-60 s es el ritmo que corresponde: una pagina rinde 20 avisos,
  # asi que 1.000 avisos son ~50 requests, poco mas de media hora.
  min_delay_s: 30.0
  max_delay_s: 60.0
  out_path: "data/raw/argenprop_caba.jsonl"

# --- Dataset sintetico (demo / testeo del pipeline sin scrape real) ---
synthetic:
  n_listings: 1200
  out_dir: "data/synthetic"

# --- Anotacion semiautomatica (LLM como pre-anotador) ---
annotation:
  n_to_annotate: 1200      # subconjunto 1.000-1.500 (segun propuesta)
  ner_out: "data/annotated/ner.jsonl"
  cls_out: "data/annotated/cls.jsonl"
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

# --- Fine-tuning NER (token classification) ---
ner:
  base_model: "dccuchile/bert-base-spanish-wwm-cased"   # BETO
  max_length: 192
  epochs: 5
  batch_size: 8            # GTX 1650 4GB: 8 con fp16 entra justo
  grad_accum: 2            # batch efectivo = 16
  lr: 3.0e-5
  weight_decay: 0.01
  fp16: true               # imprescindible en 4GB
  # Guardar un checkpoint por epoch para quedarse con el mejor cuesta ~2.6 GB de
  # disco transitorio (el estado del optimizador pesa mas que el modelo).
  # En false se entrena igual y se evalua en cada epoch, pero solo se guarda el
  # modelo final. Poner en true si sobra disco.
  save_best: false
  out_dir: "models/ner-beto"

# --- Fine-tuning clasificacion (sequence classification) ---
classifier:
  base_model: "dccuchile/bert-base-spanish-wwm-cased"
  max_length: 160
  epochs: 5
  batch_size: 8
  grad_accum: 2
  lr: 2.0e-5
  weight_decay: 0.01
  fp16: true
  multilabel: true         # un aviso puede tener varias senales a la vez
  out_dir: "models/cls-beto"
